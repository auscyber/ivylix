name: Build Lix

on:
  workflow_dispatch:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]

# A newer push to staging (or a newer push to the same PR) makes any build
# already in flight for that ref moot -- cancel it rather than let it run to
# completion, and don't let a stale build fast-forward main out from under
# a newer one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.system }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          - os: macos-latest
            system: aarch64-darwin
          - os: ubuntu-24.04-arm
            system: aarch64-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # catfooding lix
      - name: Install Lix
        uses: DeterminateSystems/nix-installer-action@v20
        with:
          source-url: 'https://install.lix.systems/lix/lix-installer-${{ matrix.system }}'
          logger: pretty
          diagnostic-endpoint: ""
          # Trust my cache as a substituter from the start, so even
          # bootstrapping the celler client below can fetch from it instead
          # of building from scratch.
          extra-conf: |
            extra-substituters = https://cache.ivymect.in/main
            extra-trusted-public-keys = main:xS+QBlQtWPB/oX9un7feA68WGJRWfizG4C0YQUsmeN4=

      # https://git.lix.systems/lix-project/lix/issues/545
      - name: Loosen apparmor restrictions
        if: matrix.os != 'macos-latest'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Speeds up every build (PR validation and staging alike) regardless of
      # cache.ivymect.in -- that one only gets populated by celler-action
      # below, and only for staging pushes, since only those are about to be
      # promoted to main.
      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ matrix.system }}-${{ hashFiles('flake.lock', '_sources/generated.json') }}
          restore-prefixes-first-match: nix-${{ matrix.system }}-

      # Push builds to (and pull from) my cache. cache.ivymect.in speaks
      # Celler (an Attic fork), so this uses the matching client/action.
      # Only for staging itself, once a change has actually landed there --
      # PR validation builds rely on the Nix store cache step above instead.
      - uses: auscyber/celler-action@main
        if: github.event_name == 'push'
        with:
          endpoint: https://cache.ivymect.in
          cache: main
          token: ${{ secrets.CELLER_TOKEN }}

      # Build lix (and deps), then use nix-fast-build to build the rest.
      - name: Build nix-fast-build
        run: nix build .#nix-fast-build

      - name: Build from the matrix
        run: |
          ./result/bin/nix-fast-build \
            --no-nom \
            --skip-cached \
            --systems '${{ matrix.system }}' \
            --flake '.#packages.${{ matrix.system }}'

  ci-success:
    name: CI success
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check build matrix result
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "Build matrix result: ${{ needs.build.result }}"
            exit 1
          fi

  # `staging` is the rolling branch everything lands on and is allowed to be
  # red; `main` only ever moves by fast-forwarding to a staging commit that
  # has actually built -- and, via celler-action's post step above, already
  # been pushed to cache -- right here first. Mirrors nixpkgs master
  # (rolling, can go red) vs nixos-unstable (only ever a known-good commit).
  promote-to-main:
    name: Promote staging to main
    needs: ci-success
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout staging
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fast-forward main
        run: git push origin HEAD:main
