name: update

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    name: Update lix source (nvfetcher via ivixlib)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Lix
        uses: DeterminateSystems/nix-installer-action@v20
        with:
          source-url: 'https://install.lix.systems/lix/lix-installer-x86_64-linux'
          logger: pretty
          diagnostic-endpoint: ""
          # Trust my cache as a substituter so building nvfetcher (and its
          # Haskell dependency closure) can pull from it instead of from
          # scratch every night.
          extra-conf: |
            extra-substituters = https://cache.ivymect.in/main
            extra-trusted-public-keys = main:xS+QBlQtWPB/oX9un7feA68WGJRWfizG4C0YQUsmeN4=

      - name: Setup Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # An installation token from a GitHub App, not the default
      # GITHUB_TOKEN: GitHub blocks GITHUB_TOKEN-authored pushes from
      # triggering other workflows (anti-recursion), which would otherwise
      # leave the PR opened below stuck forever -- its Build Lix check
      # would simply never run, so auto-merge would never fire.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # Also bumps ivixlib (supplies the update-sources/postprocess-sources
      # machinery itself) and izlix (the izlix package set this scope is
      # built alongside) so both stay current rather than pinned.
      - name: Update nixpkgs
        run: nix flake update nixpkgs ivixlib izlix --commit-lock-file

      # `update-sources` (from the shared ivixlib flakeModule) runs the forked
      # nvfetcher to re-pin the lix source, then postprocess-sources bakes the
      # real semver from version.json into _sources/<hash>/version.
      - name: Update lix source
        env:
          # nvfetcher hits the GitHub/Gitea API; a token avoids rate-limits.
          NVCHECKER_KEYS: ${{ runner.temp }}/nvchecker-keys.toml
        run: |
          printf '[keys]\ngithub = "%s"\n' "${{ secrets.GITHUB_TOKEN }}" > "$NVCHECKER_KEYS"
          nix run .#update-sources -- --keyfile "$NVCHECKER_KEYS"

      # Belt-and-suspenders: nvfetcher's own diffing skips re-running
      # update-sources' internal postprocess step when it sees no upstream
      # change, which can leave a stale/orphaned _sources/<hash>/version
      # behind from before ivixlib's postprocess-sources fix. A standalone
      # run always re-evaluates fresh against the currently-committed
      # _sources/generated.nix, so it's idempotent and safe to run every time.
      - name: Postprocess sources (idempotent safety net)
        run: nix run '.#postprocess-sources'

      - name: Commit source changes
        run: |
          git add -A -- _sources
          if ! git diff --cached --quiet -- _sources; then
            git commit -m "chore(sources): update lix source"
          else
            echo "No source changes."
          fi

      # main only ever moves via a PR that Build Lix has approved (see
      # build.yml's `pull_request` trigger + the "CI success" check) --
      # nightly updates are no exception, so this opens/refreshes a PR
      # instead of pushing straight to main like it used to.
      - name: Open update PR
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: auto-update
          delete-branch: true
          title: "chore(sources): update lix + flake inputs"
          body: |
            Automated nightly update (`nix flake update` + nvfetcher via ivixlib).

            Auto-merges once `Build Lix` passes -- same gate as any other PR.
          labels: automated

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr merge --auto --squash \
            "${{ steps.cpr.outputs.pull-request-number }}" \
            --repo "${{ github.repository }}"
