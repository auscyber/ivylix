name: update

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    name: Update lix source (nvfetcher via ivixlib)
    runs-on: ubuntu-latest

    steps:
      # An installation token from a GitHub App, not the default
      # GITHUB_TOKEN: GitHub blocks GITHUB_TOKEN-authored PRs/pushes from
      # triggering other workflows (anti-recursion), which would otherwise
      # leave the PR below unable to kick off build.yml's `staging` build --
      # and with it, promotion to main -- at all. It also signs commits as
      # the app's own bot identity (auscyber-bot[bot]) instead of the stock
      # github-actions[bot].
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: staging
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Install Lix
        uses: DeterminateSystems/nix-installer-action@v20
        with:
          source-url: 'https://install.lix.systems/lix/lix-installer-x86_64-linux'
          logger: pretty
          diagnostic-endpoint: ""
          # Trust my cache as a substituter so building nvfetcher (and its
          # Haskell dependency closure) can pull from it instead of from
          # scratch every night.
          extra-conf: |
            extra-substituters = https://cache.ivymect.in/main
            extra-trusted-public-keys = main:xS+QBlQtWPB/oX9un7feA68WGJRWfizG4C0YQUsmeN4=

      # Also bumps ivixlib (supplies the update-sources/postprocess-sources
      # machinery itself) and izlix (the izlix package set this scope is
      # built alongside) so both stay current rather than pinned. Left
      # uncommitted here -- the PR step below packages it up alongside the
      # source update into a single commit.
      - name: Update nixpkgs
        run: nix flake update nixpkgs ivixlib izlix

      # `update-sources` (from the shared ivixlib flakeModule) runs the forked
      # nvfetcher to re-pin the lix source, then postprocess-sources bakes the
      # real semver from version.json into _sources/<hash>/version.
      - name: Update lix source
        env:
          # nvfetcher hits the GitHub/Gitea API; a token avoids rate-limits.
          NVCHECKER_KEYS: ${{ runner.temp }}/nvchecker-keys.toml
        run: |
          printf '[keys]\ngithub = "%s"\n' "${{ secrets.GITHUB_TOKEN }}" > "$NVCHECKER_KEYS"
          nix run .#update-sources -- --keyfile "$NVCHECKER_KEYS"

      # Belt-and-suspenders: nvfetcher's own diffing skips re-running
      # update-sources' internal postprocess step when it sees no upstream
      # change, which can leave a stale/orphaned _sources/<hash>/version
      # behind from before ivixlib's postprocess-sources fix. A standalone
      # run always re-evaluates fresh against the currently-committed
      # _sources/generated.nix, so it's idempotent and safe to run every time.
      - name: Postprocess sources (idempotent safety net)
        run: nix run '.#postprocess-sources'

      # Opens (or updates) a PR against staging rather than pushing directly.
      # sign-commits creates the commit through the API under the app's own
      # identity (auscyber-bot[bot]), rather than whatever local git config
      # says -- staging is allowed to be transiently red, that's the point
      # of it, and build.yml's `pull_request`/`push: staging` triggers pick
      # this up either way.
      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore(sources): update lix source and flake inputs"
          title: "chore(sources): update lix source and flake inputs"
          branch: update-lix-source
          base: staging
          sign-commits: true

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number
        run: |
          gh pr merge --auto --merge "${{ steps.cpr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
